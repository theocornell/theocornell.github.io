<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fast Jokes</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.2/css/bulma.min.css">
  <link rel="stylesheet" href="site.css">
</head>
<body>
  <section class="section">
    <div class="container">
      <h1 class="title">Fast Jokes</h1>

      <div class="field is-grouped is-grouped-multiline">
        <div class="control">
          <label class="label" for="language">Language</label>
          <div class="select">
            <select id="selLang">
              <option value="any" selected>Any</option>
              <option value="cs">Czech</option>
              <option value="de">German</option>
              <option value="en">English</option>
              <option value="es">Spanish</option>
              <option value="eu">Basque</option>
              <option value="fr">French</option>
              <option value="gl">Galician</option>
              <option value="hu">Hungarian</option>
              <option value="it">Italian</option>
              <option value="lt">Lithuanian</option>
              <option value="pl">Polish</option>
              <option value="sv">Swedish</option>
            </select>
          </div>
        </div>

        <div class="control">
          <label class="label" for="category">Category</label>
          <div class="select">
            <select id="selCat">
              <option value="any" selected>Any</option>
              <option value="neutral">Neutral</option>
              <option value="chuck">Chuck Norris</option>
            </select>
          </div>
        </div>

        <div class="control">
          <label class="label" for="number">Number</label>
          <div class="select">
            <select id="selNum">
              <option value="all" selected>All</option>
              <option>1</option><option>2</option><option>3</option>
              <option>4</option><option>5</option><option>6</option>
              <option>7</option><option>8</option><option>9</option>
              <option>10</option>
            </select>
          </div>
        </div>

        <div class="control">
          <label class="label" for="jokeId">Joke ID</label>
          <input class="input" type="number" id="jokeId" min="0" placeholder="optional">
        </div>

        <div class="control">
          <label class="label">&nbsp;</label>
          <button class="button is-primary" id="btnAmuse">Get jokes</button>
        </div>
      </div>

      <div id="results"></div>
    </div>
  </section>
  <script src="main.js"></script>
</body>
</html>
